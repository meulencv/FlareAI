<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlareAI Voice</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #eee;
           display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { text-align: center; }
    button { font-size: 1.2rem; padding: 1rem 2rem; border: 0; border-radius: 999px;
             background: #ff5a36; color: #fff; cursor: pointer; }
    button.on { background: #444; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { margin-top: 1rem; color: #aaa; }
  </style>
</head>
<body>
<main>
  <h1>🔥 Habla con Flare</h1>
  <button id="btn">🎙️ Iniciar llamada</button>
  <p id="status">Listo</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
  const { Room, RoomEvent, Track } = LivekitClient;
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  let room = null;

  async function start() {
    btn.disabled = true;
    status.textContent = 'Pidiendo token…';
    const res = await fetch('/token', { method: 'POST' });
    if (!res.ok) { status.textContent = 'Error: ' + await res.text(); btn.disabled = false; return; }
    const { url, token } = await res.json();

    room = new Room();
    room.on(RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === Track.Kind.Audio) track.attach(); // reproduce la voz del agente
    });
    room.on(RoomEvent.Disconnected, stop);

    status.textContent = 'Conectando…';
    await room.connect(url, token);
    await room.localParticipant.setMicrophoneEnabled(true);

    status.textContent = 'En llamada — habla con Flare';
    btn.textContent = '⏹️ Colgar';
    btn.classList.add('on');
    btn.disabled = false;
  }

  function stop() {
    if (room) { room.disconnect(); room = null; }
    status.textContent = 'Llamada terminada';
    btn.textContent = '🎙️ Iniciar llamada';
    btn.classList.remove('on');
    btn.disabled = false;
  }

  btn.onclick = () => (room ? stop() : start().catch(e => { status.textContent = 'Error: ' + e.message; btn.disabled = false; }));
</script>
</body>
</html>
